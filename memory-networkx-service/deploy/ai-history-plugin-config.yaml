apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-history
  namespace: higress-system
spec:
  matchRules:
  - config:
      # Redis 配置
      redis:
        serviceName: redis.higress-system.svc.cluster.local
        servicePort: 6379
        timeout: 2000
        database: 0
      
      # 缓存配置
      cacheKeyPrefix: "higress-ai-history:"
      identityHeader: "Authorization"
      fillHistoryCnt: 3
      cacheTTL: 0  # 0 表示永不过期
      
      # Memory Enhancement Service 配置（新增）
      memoryService:
        enabled: true  # 启用记忆增强功能
        serviceName: memory-service.higress-system.svc.cluster.local
        servicePort: 8080
        timeout: 5000  # 超时时间（毫秒）
        topK: 5        # 从记忆库中检索的相关记忆数量
    
    ingress:
    - higress-gateway
    
  # 使用 ai-history 插件的 OCI 镜像
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/ai-history:1.0.0
