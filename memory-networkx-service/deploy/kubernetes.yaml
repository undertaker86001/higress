---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-service-config
  namespace: higress-system
data:
  REDIS_HOST: "redis.higress-system.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  SERVICE_PORT: "8080"
  LOG_LEVEL: "INFO"
  SHORT_TERM_MEMORY_SIZE: "20"
  RETRIEVE_TOP_N: "5"
  SUMMARY_MAX_TAGS: "30"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-enhancement-service
  namespace: higress-system
  labels:
    app: memory-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memory-service
  template:
    metadata:
      labels:
        app: memory-service
    spec:
      containers:
      - name: memory-service
        image: your-registry/memory-enhancement-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: memory-service-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: memory-service-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: memory-service-config
              key: REDIS_DB
        - name: SERVICE_PORT
          valueFrom:
            configMapKeyRef:
              name: memory-service-config
              key: SERVICE_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: memory-service-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
  namespace: higress-system
  labels:
    app: memory-service
spec:
  type: ClusterIP
  selector:
    app: memory-service
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
